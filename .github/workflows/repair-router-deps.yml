name: Update patched React Router on feature branch
on:
  push:
    branches:
      - feature/transcription-only-cloudflare
    paths:
      - .github/workflows/repair-router-deps.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/transcription-only-cloudflare
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Update router and lockfile
        run: npm install react-router-dom@7.18.2 --save-exact --package-lock-only --ignore-scripts
      - name: Verify all app checks and runtime security
        run: |
          npm ci
          npm run check
          node --test cloudflare/transcribe-worker.node.mjs
          npm audit --omit=dev --audit-level=high
      - name: Commit vetted dependency lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "fix: patch React Router security advisory GHSA-qwww-vcr4-c8h2"
          git push origin HEAD:feature/transcription-only-cloudflare
